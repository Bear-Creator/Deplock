---
# Установка Docker CE через официальный репозиторий
- name: Обновление кэша apt и установка базовых пакетов
  apt:
    name:
      - apt-transport-https
      - ca-certificates
      - curl
      - gnupg-agent
      - software-properties-common
    state: present
    update_cache: yes

- name: Добавление GPG ключа Docker
  apt_key:
    url: https://download.docker.com/linux/ubuntu/gpg
    state: present

- name: Добавление репозитория Docker
  apt_repository:
    repo: deb [arch=amd64] https://download.docker.com/linux/ubuntu {{ ansible_distribution_release }} stable
    state: present

- name: Установка Docker CE
  apt:
    name: 
      - docker-ce
      - docker-ce-cli
      - containerd.io
    state: present

- name: Установка docker SDK for python (необходим для ansible docker modules)
  pip:
    name: docker
    executable: pip3 # подразумевается ubuntu 24.04 с python3

- name: Запуск и включение сервиса Docker
  systemd:
    name: docker
    enabled: yes
    state: started
