[project]
name = "deplock"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "fastapi>=0.110.0",
    "uvicorn>=0.28.0",
    "docker>=7.0.0",
    "pydantic-settings>=2.2.0",
    "sqlalchemy>=2.0.0",
    "aiosqlite>=0.20.0",
    "alembic>=1.13.1",
    "paramiko>=4.0.0",
]

[dependency-groups]
dev = [
    "pre-commit>=4.5.1",
    "ruff>=0.15.10",
    "ty>=0.0.29",
    "pytest>=8.1.1",
    "pytest-asyncio>=0.23.5",
    "httpx>=0.27.0",
]

[tool.ruff]
line-length = 88

target-version = "py314" 

exclude = [
    ".bzr",
    ".direnv",
    ".eggs",
    ".git",
    ".git-rewrite",
    ".hg",
    ".mypy_cache",
    ".nox",
    ".pants.d",
    ".pytype",
    ".ruff_cache",
    ".svn",
    ".tox",
    ".venv",
    "__pypackages__",
    "_build",
    "buck-out",
    "build",
    "dist",
    "node_modules",
    "venv",
]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes (ошибки синтаксиса, неиспользуемые импорты)
    "I",   # isort (сортировка импортов)
    "B",   # flake8-bugbear (поиск неочевидных багов)
    "C4",  # flake8-comprehensions (улучшение генераторов и словарей)
    "UP",  # pyupgrade (автоматическое обновление старого синтаксиса на новый)
    "SIM", # flake8-simplify (советы по упрощению кода)
    "PT",  # flake8-pytest-style (лучшие практики для тестов)
    "RET", # flake8-return (проверки для return)
    "RUF", # собственные правила Ruff
]

ignore = [
    "E501",
    "RUF001",
    "RUF002",
    "RUF003",
    "B008" #?
]

fixable = ["ALL"]
unfixable = []

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401"]
"tests/**/*.py" = ["S101"]

[tool.ruff.lint.isort]
known-first-party = ["deplock"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"

[tool.pytest.ini_options]
pythonpath = ["backend"]
testpaths = ["backend/tests"]
asyncio_default_fixture_loop_scope = "function"
asyncio_mode = "auto"
