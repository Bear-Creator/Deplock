repos:
  - repo: local
    hooks:
      - id: ruff-check
        name: Ruff Check
        entry: uv run ruff check --force-exclude
        language: system
        types: [python]
        args: ["--fix"]

      - id: ruff-format
        name: Ruff Format
        entry: uv run ruff format --force-exclude
        language: system
        types: [python]

      - id: ty-check
        name: Ty Type Check
        entry: uv run ty check
        language: system
        types: [python]
        always_run: true